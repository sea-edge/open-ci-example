name: Copilot Coding Agent Demo

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  copilot-setup-steps:
    runs-on: openci-runner-beta
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'copilot')) ||
      (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'copilot')) ||
      github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Copilot Coding Agent
      uses: github/copilot-coding-agent@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
